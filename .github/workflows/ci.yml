name: Notion projection guard CI

on:
  push:
    branches: [main, 'migration/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Node ${{ matrix.node }} tests and source provenance
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Guard and installed-runtime regressions
        run: node --test test_guard.cjs test_runtime.cjs test_revision.cjs supervision_gate_cases.cjs serialized_format_cases.cjs test_nodekit_pointer_partial.cjs review_timeout_policy_cases.cjs review_timeout_ledger_cases.cjs
      - name: Verify local review-timeout candidate pins
        run: node verify_review_timeout_candidate.cjs
      - name: Provenance gate regression tests
        run: python3 -m unittest -v test_provenance.py
      - name: Fetch the fixed source archive and import tag
        shell: bash
        run: |
          git fetch --no-tags https://github.com/HeaInSeo/infra-lab.git refs/tags/archive/npg-before-split-20261020:refs/provenance/npg-source-archive
          git fetch --no-tags origin refs/tags/import/infra-lab-20261020:refs/tags/import/infra-lab-20261020
      - name: Verify every preserved commit and immutable code baseline
        run: python3 verify_provenance.py
